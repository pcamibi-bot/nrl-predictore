<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NRL Predictor v1.6 - Bookie Edition</title>
    <style>
        :root { --primary: #002b5b; --accent: #ffcc00; --danger: #e63946; --light: #f8f9fa; --dark: #1a1a1b; }
        body { font-family: 'Roboto', sans-serif; background: #e0e0e0; padding: 10px; color: var(--dark); }
        .card { background: white; padding: 15px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 12px; border-top: 5px solid var(--primary); }
        h2 { margin: 0 0 10px 0; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1px; color: var(--primary); }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        input, select { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 4px; font-size: 1rem; background: #fff; box-sizing: border-box; }
        button { width: 100%; padding: 15px; background: var(--primary); color: white; border: none; border-radius: 5px; font-weight: bold; font-size: 1.1rem; cursor: pointer; margin: 10px 0; }
        
        /* Result Display Styles */
        #resultBox { display: none; background: var(--dark); color: white; padding: 20px; border-radius: 10px; text-align: center; }
        .margin-badge { background: var(--accent); color: var(--dark); padding: 5px 15px; border-radius: 20px; font-weight: bold; font-size: 0.8rem; margin-bottom: 10px; display: inline-block; }
        .winner-text { font-size: 2rem; display: block; margin: 5px 0; color: #fff; }
        .line-value { font-size: 1.2rem; color: var(--accent); font-weight: bold; }
        .total-box { border-top: 1px solid #444; margin-top: 15px; padding-top: 15px; display: flex; justify-content: space-around; }
        
        /* History Log */
        .log-item { background: white; padding: 10px; border-radius: 5px; margin-bottom: 8px; border-left: 8px solid var(--primary); display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem; }
    </style>
</head>
<body onload="loadHistory()">

    <div style="text-align:center; padding: 10px;">
        <h1 style="margin:0; font-size: 1.4rem; color: var(--primary);">PACIFIC PREDICTOR v1.6</h1>
        <small>Official Strategy Tool | CHARCHITECH Ltd</small>
    </div>

    <div class="card">
        <h2>Match Conditions</h2>
        <select id="weather">
            <option value="1.0">DRY - Fast Track</option>
            <option value="0.88">WET - Low Scoring</option>
        </select>
    </div>

    <div class="grid">
        <div class="card">
            <h2>Home Team</h2>
            <input type="text" id="nameA" placeholder="Name">
            <label style="font-size:0.7rem;">Power Rating (1-100)</label>
            <input type="number" id="pA" value="75">
        </div>
        <div class="card">
            <h2>Away Team</h2>
            <input type="text" id="nameB" placeholder="Name">
            <label style="font-size:0.7rem;">Power Rating (1-100)</label>
            <input type="number" id="pB" value="70">
        </div>
    </div>

    <button onclick="calculate()">GENERATE BOOKIE LINE</button>

    <div id="resultBox">
        <div id="marginType" class="margin-badge">CATEGORY</div>
        <div id="winnerText" class="winner-text">TEAM BY 00</div>
        <div class="line-value">LINE: <span id="lineVal">0.0</span></div>
        
        <div class="total-box">
            <div><small>O/U TOTAL</small><br><strong id="totalPts">00.5</strong></div>
            <div><small>PROBABILITY</small><br><strong id="prob">0%</strong></div>
        </div>
        <button onclick="saveToLog()" style="background:#444; font-size:0.8rem; padding:8px; width:60%;">💾 SAVE TO AUDIT</button>
    </div>

    <div id="logSection" style="margin-top:20px;">
        <h3 style="font-size:0.9rem; color:#666;">PREDICTION AUDIT LOG</h3>
        <div id="logList"></div>
    </div>

    <script>
        let currentEntry = "";

        function calculate() {
            const w = parseFloat(document.getElementById('weather').value);
            const nA = document.getElementById('nameA').value || "Home";
            const nB = document.getElementById('nameB').value || "Away";
            const valA = parseFloat(document.getElementById('pA').value);
            const valB = parseFloat(document.getElementById('pB').value);

            // Logic Upgrade: Increased Home Advantage to +8 based on Rd 4 Audit
            let scoreA = (valA * 0.4) + 8; 
            let scoreB = (valB * 0.4);
            
            let diff = (scoreA - scoreB) * w;
            let winner = diff > 0 ? nA : nB;
            let margin = Math.abs(diff).toFixed(1);
            let category = margin > 12.5 ? "13+ BIG WIN" : "1-12 LITTLE WIN";
            
            // Generate professional decimal line
            let line = (Math.floor(margin) + 0.5);
            let total = (valA + valB) * 0.35 * w;

            // UI Update
            document.getElementById('resultBox').style.display = "block";
            document.getElementById('marginType').innerText = category;
            document.getElementById('winnerText').innerText = winner + " BY " + margin;
            document.getElementById('lineVal').innerText = "-" + line;
            document.getElementById('totalPts').innerText = total.toFixed(1);
            document.getElementById('prob').innerText = (50 + Math.abs(diff)).toFixed(0) + "%";

            currentEntry = winner + " (" + category + ") | Line: -" + line;
            window.scrollTo(0, document.body.scrollHeight);
        }

        function saveToLog() {
            if (!currentEntry) return;
            let history = JSON.parse(localStorage.getItem('nrlHistoryv16')) || [];
            history.unshift(currentEntry);
            localStorage.setItem('nrlHistoryv16', JSON.stringify(history));
            renderHistory();
        }

        function renderHistory() {
            const list = document.getElementById('logList');
            const history = JSON.parse(localStorage.getItem('nrlHistoryv16')) || [];
            list.innerHTML = "";
            history.forEach(item => {
                const div = document.createElement('div');
                div.className = 'log-item';
                div.innerHTML = "<span>" + item + "</span> <span>📊</span>";
                list.appendChild(div);
            });
        }

        function loadHistory() { renderHistory(); }
    </script>
</body>
</html>
