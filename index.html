<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NRL Predictor Pro v1.4</title>
    <style>
        :root { --primary: #1d3557; --accent: #e63946; --light: #f1faee; --gold: #fbc02d; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--light); padding: 15px; color: var(--primary); }
        .card { background: white; padding: 15px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); margin-bottom: 15px; }
        h2 { margin: 0 0 10px 0; font-size: 1.1rem; border-bottom: 2px solid var(--accent); display: inline-block; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        label { font-size: 0.8rem; font-weight: bold; display: block; margin-top: 8px; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 8px; margin-top: 4px; font-size: 1rem; }
        .weather-box { background: #a8dadc; padding: 12px; border-radius: 10px; margin-bottom: 15px; display: flex; align-items: center; justify-content: space-between; font-weight: bold; }
        button { width: 100%; padding: 16px; background: var(--accent); color: white; border: none; border-radius: 10px; font-size: 1.1rem; font-weight: bold; cursor: pointer; margin-top: 10px; box-shadow: 0 4px 0 #b92e3a; }
        #resultBox { display: none; margin-top: 20px; background: var(--primary); color: white; padding: 20px; border-radius: 15px; text-align: center; }
        .margin-big { font-size: 2rem; display: block; color: #a8dadc; margin: 10px 0; font-weight: bold; }
        .ht-box { background: rgba(255,255,255,0.1); padding: 10px; border-radius: 10px; margin-bottom: 15px; border-left: 4px solid var(--gold); }
        .stats-row { display: flex; justify-content: space-around; margin-top: 15px; border-top: 1px solid rgba(255,255,255,0.2); padding-top: 15px; }
        .stat-val { font-size: 1.2rem; font-weight: bold; display: block; }
        .stat-label { font-size: 0.7rem; text-transform: uppercase; opacity: 0.8; }
        /* NEW LEDGER STYLES */
        #logSection { margin-top: 30px; border-top: 2px dashed #ccc; padding-top: 20px; }
        .log-entry { background: #fff; padding: 10px; border-radius: 8px; margin-bottom: 10px; font-size: 0.85rem; border-left: 5px solid var(--primary); display: flex; justify-content: space-between; align-items: center; }
    </style>
</head>
<body>

    <h1 style="text-align:center; font-size: 1.5rem; margin-bottom: 20px;">🏉 NRL Predictor Pro</h1>

    <div class="weather-box">
        <span>🌧️ Weather Mode</span>
        <select id="weather">
            <option value="1">Dry / Sunny</option>
            <option value="0.85">Wet / Raining</option>
        </select>
    </div>

    <div class="card">
        <h2>Home Team</h2>
        <input type="text" id="nameA" placeholder="e.g. Broncos">
        <div class="grid">
            <div><label>Avg Pts</label><input type="number" id="hA" value="21.5"></div>
            <div><label>Comp. %</label><input type="number" id="cA" value="80"></div>
            <div><label>Discipline</label><input type="number" id="dA" value="68"></div>
        </div>
    </div>

        <h2>Away Team</h2>
        <input type="text" id="nameB" placeholder="e.g. Dolphins">
        <div class="grid">
